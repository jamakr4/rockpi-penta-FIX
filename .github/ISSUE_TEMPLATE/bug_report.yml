name: Bug Report
description: Report something that isn't working correctly
title: "[Bug]: "
labels: ["bug"]
assignees: ["jamakr4"]

body:
  - type: markdown
    attributes:
      value: |
        Please provide as much detail as possible to help us reproduce the issue.

  - type: input
    id: hardware
    attributes:
      label: Board and Hardware
      description: Include the board model and relevant Penta HAT or drive details.
      placeholder: e.g. Raspberry Pi 5 with Radxa Penta SATA HAT
    validations:
      required: true

  - type: input
    id: os_version
    attributes:
      label: Operating System and Version
      placeholder: e.g. Raspberry Pi OS Trixie 64-bit
    validations:
      required: true

  - type: input
    id: package_version
    attributes:
      label: rockpi-penta Version
      placeholder: e.g. 0.2.3
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: What happened, and what did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Start the rockpi-penta service
        2. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs and Additional Information
      description: Add relevant service logs or configuration details.
      render: text
