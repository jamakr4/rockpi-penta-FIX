[fan]
# When the temperature is above lv0 (35'C), the fan at 25% power,
# and lv1 at 50% power, lv2 at 75% power, lv3 at 100% power.
# When the temperature is below lv0, the fan is turned off.
# You can change these values if necessary.
lv0 = 35
lv1 = 40
lv2 = 45
lv3 = 50

[key]
# You can customize the function of the key, currently available functions are
# slider: oled display next page
# switch: fan turn on/off switch
# reboot, poweroff
# If you have any good suggestions for key functions, 
# please add an issue on https://github.com/radxa/rockpi-penta/issues
click = slider
twice = switch
press = none

[time]
# twice: maximum time between double clicking (seconds)
# press: long press time (seconds)
twice = 0.7
press = 1.8

[slider]
# Whether the oled auto display next page and the time interval (seconds)
auto = true
time = 10
refresh = 1.0

# Mountpoints shown on the disk usage page, separated by |.
# Use actual mountpoints (for example / and /mnt/storage).
[disk]
space_usage_mnt_points = /

# Mountpoints whose read/write rates should be shown, separated by |.
# Leave empty to disable disk I/O pages.
io_usage_mnt_points =

# Detect and display temperatures for disks supported by smartctl.
disks_temp = true

[network]
# Interfaces to show, separated by |. Use "auto" for all non-loopback links.
interfaces = auto

[oled]
# Whether rotate the text of oled 180 degrees, whether use Fahrenheit, adjust brightness
rotate = false
f-temp = false
brightness = 255
