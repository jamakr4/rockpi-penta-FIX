[fan]
# When the temperature is above lv0 (35'C), the fan at 25% power,
# and lv1 at 50% power, lv2 at 75% power, lv3 at 100% power.
# When the temperature is below lv0, the fan is turned off.
# You can change these values if necessary.
lv0 = 35
lv1 = 40
lv2 = 45
lv3 = 50

# Set linear = true to smoothly ramp from 25% at lv0 to 100% at lv3.
# In linear mode, lv1 and lv2 are ignored. Set false for the four steps above.
linear = false

[key]
# You can customize the function of the key, currently available functions are
# slider: oled display next page
# switch: fan turn on/off switch
# reboot, poweroff
# If you have any good suggestions for key functions, 
# please add an issue on https://github.com/radxa/rockpi-penta/issues
click = slider
twice = switch
press = none

[time]
# twice: maximum time between double clicking (seconds)
# press: long press time (seconds)
twice = 0.7
press = 1.8

[slider]
# Whether the oled auto display next page and the time interval (seconds)
auto = true
time = 10
refresh = 1.0

# Mountpoints shown on the disk usage page and checked for disk-usage warnings.
# Use the TARGET path from: findmnt -S /dev/sda2
[disk]
space_usage_mnt_points = /|/srv/dev-disk-by-uuid-69FC-D875

# Mountpoints whose read/write rates should be shown, separated by |.
# Leave empty to disable disk I/O pages.
# Use the same TARGET path if you want I/O rates for that disk.
io_usage_mnt_points =

# Detect and display temperatures for disks supported by smartctl.
disks_temp = true

[network]
# Interfaces to show, separated by |. Use "auto" for all non-loopback links.
interfaces = auto

[oled]
# Whether rotate the text of oled 180 degrees, whether use Fahrenheit, adjust brightness
rotate = false
f-temp = false
# 0=dark 255=Bright
brightness = 255

[Warnings]
# Active warnings override the normal OLED pages until all conditions clear.
enabled = true
# Show the active warning count at the top right of the OLED.
showwarningcount = true
# Use a filled badge with a cut-out number instead of plain text.
warningcountinverted = true
smart_health = true
disk_temperature = true
disk_temp_limit = 55
cpu_temperature = true
cpu_temp_limit = 85
mount_missing = true
disk_usage = true
disk_usage_limit = 90
raid_degraded = true

# Optional network checks. Name the interfaces you want monitored.
network_interfaces = eth0
network_link = false
network_low_speed = false
network_min_speed_mbps = 100
network_latency = false
network_target = 1.1.1.1
network_latency_limit_ms = 100
